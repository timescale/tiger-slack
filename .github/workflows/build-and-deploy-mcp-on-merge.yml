name: Build and Deploy MCP - Merge main
on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - .github/workflows/*mcp*
jobs:
  build:
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - name: Dispatch Workflow
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: build.yaml
          ref: "main"
          inputs: >
            {
              "docker_context": "./mcp",
              "dockerfile_path": "./mcp/Dockerfile",
              "image_name": "tiger-slack-mcp-server",
              "repository": "tiger-slack",
              "sha": "${{ github.sha }}",
              "latest": true
            }

  deploy:
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    needs: build
    strategy:
      matrix:
        include:
          - env: dev
            namespace: savannah-system
          - env: prod
            namespace: tiger-mcp
    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - name: Dispatch Workflow - ${{ matrix.env }}
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: deploy.yaml
          ref: "main"
          inputs: >
            {
              "repository": "tiger-slack-mcp-server",
              "sha": "${{ github.sha }}",
              "env": "${{ matrix.env }}",
              "namespace": "${{ matrix.namespace }}"
            }
